      /* Root loader overlay styles */
      #system-bootloader {
        position: fixed;
        inset: 0;
        background-color: #fcfcfc;
        color: #262626;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        z-index: 9999;
        user-select: none;
        text-align: center;
        font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
        transition: opacity 0.35s ease-in-out, transform 0.35s ease-in-out, filter 0.35s ease-in-out;
      }
      
      /* Grid background details */
      .tech-grid {
        background-size: 40px 40px;
        background-image: 
          linear-gradient(to right, rgba(0, 0, 0, 0.03) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(0, 0, 0, 0.03) 1px, transparent 1px);
      }

      .tech-grid-dots {
        background-size: 20px 20px;
        background-image: radial-gradient(circle, rgba(0, 0, 0, 0.05) 1px, transparent 1px);
      }

      /* CPU container animations */
      @keyframes spin-clockwise {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      @keyframes spin-counter-clockwise {
        from { transform: rotate(0deg); }
        to { transform: rotate(-360deg); }
      }

      .animate-spin-circuit-cw {
        animation: spin-clockwise 60s linear infinite;
        will-change: transform;
      }

      .animate-spin-circuit-ccw {
        animation: spin-counter-clockwise 80s linear infinite;
        will-change: transform;
      }

      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: .5; }
      }

      .animate-pulse {
        animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }

      @keyframes bounce {
        0%, 100% {
          transform: translateY(-25%);
          animation-timing-function: cubic-bezier(0.8, 0, 1, 1);
        }
        50% {
          transform: translateY(0);
          animation-timing-function: cubic-bezier(0, 0, 0.2, 1);
        }
      }

      .animate-bounce {
        animation: bounce 1s infinite;
      }

      /* Helpers for layout sizes where Tailwind compiled classes might lag */
      #system-bootloader .relative { position: relative; }
      #system-bootloader .absolute { position: absolute; }
      #system-bootloader .inset-0 { top: 0; right: 0; bottom: 0; left: 0; }
      #system-bootloader .inset-3 { top: 0.75rem; right: 0.75rem; bottom: 0.75rem; left: 0.75rem; }

    <script>
      (function() {
        var progress = 0;
        var targetProgress = 92;
        var doneCalled = false;
        var intervalId = null;

        var progressBar = document.getElementById('loader-progress-bar');
        var counterEl = document.getElementById('loader-counter');
        
        function updateLoader(value) {
          progress = value;
          if (progressBar) progressBar.style.width = progress + '%';
          if (counterEl) counterEl.innerText = 'BOOTING SYSTEM // ' + progress + '% COMPLETE';
        }

        // Terminal log sequence with trailing dots animation
        var frames = ['...', '..', '.', '', '.', '..'];
        var frameIndex = 0;
        var dotTimer = setInterval(function() {
          var dotsEl = document.getElementById('term-loading-dots');
          if (!dotsEl) return;
          if (progress >= 100 || doneCalled) {
            clearInterval(dotTimer);
            dotsEl.innerText = '...';
            return;
          }
          frameIndex = (frameIndex + 1) % 6;
          dotsEl.innerText = frames[frameIndex];
        }, 300);

        function updateTerminalLogs(progressVal) {
          if (progressVal >= 100 || doneCalled) {
            if (dotTimer) {
              clearInterval(dotTimer);
            }
            var dotsEl = document.getElementById('term-loading-dots');
            if (dotsEl) dotsEl.innerText = '...';
          }
        }

        function step() {
          if (doneCalled) return;
          
          var increment = 0;
          var delay = 30;

          if (progress < 60) {
            // Fast: 0 -> 60%
            increment = Math.floor(Math.random() * 3) + 2; // 2-4%
            delay = Math.floor(Math.random() * 20) + 30; // 30-50ms
          } else if (progress < 85) {
            // Slower: 60 -> 85%
            increment = Math.random() < 0.7 ? 1 : 0; // 0-1%
            delay = Math.floor(Math.random() * 50) + 100; // 100-150ms
          } else if (progress < 92) {
            // Very slow: 85 -> 92%
            increment = Math.random() < 0.3 ? 1 : 0; // 0-1%
            delay = Math.floor(Math.random() * 150) + 250; // 250-400ms
          }

          if (increment > 0 && progress < targetProgress) {
            var nextVal = Math.min(targetProgress, progress + increment);
            updateLoader(nextVal);
            updateTerminalLogs(progress);
          }

          if (progress < targetProgress) {
            intervalId = setTimeout(step, delay);
          }
        }

        // Start simulation immediately
        intervalId = setTimeout(step, 30);

        function dismissLoader() {
          if (doneCalled) return;
          doneCalled = true;
          if (intervalId) clearTimeout(intervalId);
          if (dotTimer) clearInterval(dotTimer);

          // Jump to 100%
          updateLoader(100);

          // Wait 150ms for 100% state to display visually, then smoothly fade out loader
          setTimeout(function() {
            var loaderEl = document.getElementById('system-bootloader');
            if (loaderEl) {
              loaderEl.style.opacity = '0';
              loaderEl.style.transform = 'scale(0.98)';
              loaderEl.style.filter = 'blur(4px)';
              loaderEl.style.pointerEvents = 'none';
              
              // Remove from DOM after transition completes (350ms)
              setTimeout(function() {
                var parent = loaderEl.parentNode;
                if (parent) {
                  parent.removeChild(loaderEl);
                }
              }, 350);
            }
          }, 150);
        }

        // Global handshake API exposed to React
        window.__loaderDone = dismissLoader;
        window.__signalAppReady = dismissLoader;
        document.addEventListener('APP_READY', dismissLoader);

        // Failsafe fallback: if app fails to signal within 8000ms (8s), dismiss to avoid stuck UI
        setTimeout(function() {
          if (!doneCalled) {
            console.warn('[System Bootloader] Failsafe timeout reached before APP_READY signal received. Dismissing loader.');
            dismissLoader();
          }
        }, 8000);
      })();
    </script>
